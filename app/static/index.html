<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brosir AI</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101827; color: #eef4ff; }
    main { width: min(720px, calc(100% - 32px)); margin: 8vh auto; }
    section { background: #182337; border: 1px solid #344665; border-radius: 14px; padding: 28px; box-shadow: 0 18px 60px #0006; }
    h1 { margin-top: 0; }
    .status { display: flex; align-items: center; gap: 10px; margin: 20px 0; font-size: 1.1rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #d65c6f; }
    .dot.on { background: #50d890; }
    button { border: 0; border-radius: 8px; padding: 11px 16px; margin-right: 8px; cursor: pointer; font-weight: 700; }
    #start { background: #50d890; color: #07160d; }
    #stop { background: #d65c6f; color: white; }
    input { width: 100%; box-sizing: border-box; margin-top: 20px; padding: 13px; border-radius: 8px; border: 1px solid #52698f; background: #0e1625; color: white; }
    pre { min-height: 48px; white-space: pre-wrap; color: #b9c9e5; }
    small { color: #9db0d0; }
  </style>
</head>
<body>
  <main><section>
    <h1>Brosir AI</h1>
    <small>The service stays ready. Microphone access starts only after you choose Start listening.</small>
    <div class="status"><span id="dot" class="dot"></span><span id="state">Not listening</span></div>
    <button id="start">Start listening</button>
    <button id="stop">Stop listening</button>
    <input id="command" placeholder="Type or transcribe: Brosir, remember this incident" aria-label="Brosir command">
    <pre id="result"></pre>
  </section></main>
  <script>
    const dot = document.querySelector('#dot');
    const state = document.querySelector('#state');
    const result = document.querySelector('#result');
    async function refresh() {
      const data = await (await fetch('/v1/voice/status')).json();
      dot.classList.toggle('on', data.active);
      state.textContent = data.active ? 'Listening with consent' : 'Not listening';
    }
    document.querySelector('#start').onclick = async () => { await fetch('/v1/voice/start', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({consent: true}) }); await refresh(); };
    document.querySelector('#stop').onclick = async () => { await fetch('/v1/voice/stop', { method: 'POST' }); await refresh(); };
    document.querySelector('#command').addEventListener('keydown', async (event) => {
      if (event.key !== 'Enter') return;
      const response = await fetch('/v1/voice/command', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: event.target.value, speaker: 'human'}) });
      result.textContent = JSON.stringify(await response.json(), null, 2);
      event.target.value = '';
    });
    refresh();
  </script>
</body>
</html>
